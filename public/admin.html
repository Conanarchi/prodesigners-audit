<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Audit Requests · ProDesigners</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--bg); }
  .adm-top { display: flex; align-items: center; gap: 16px; min-height: 60px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  .adm-top .wrap { display: flex; align-items: center; gap: 14px; width: 100%; }
  .adm-top h1 { font-size: 17px; margin-left: 6px; }
  .adm-top .sp { margin-left: auto; display: flex; gap: 8px; }
  @media (max-width: 560px) { .adm-top h1 { display: none; } .filters input[type=search] { max-width: none; margin-left: 0; } }
  .login { max-width: 380px; margin: 12vh auto; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 14px; }
  .login h2 { font-size: 22px; }
  .main { padding-block: 24px 80px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .stat b { display: block; font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
  .stat span { font: 500 11px/1.4 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filters input[type=search] { max-width: 260px; min-height: 40px; padding: 8px 12px; margin-left: auto; width: 100%; font: 400 15px var(--f-body); border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .rows { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 110px minmax(0, 1.4fr) minmax(0, 1fr) 120px 110px; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
  .row:hover { border-color: var(--ink); }
  .row .ref { font: 500 13px var(--f-mono); }
  .row .who b { display: block; font-weight: 600; }
  .row small { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  @media (max-width: 760px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .c3, .row .amt { display: none; } .row .ref { grid-column: 1; } .row .badge { grid-row: 1; grid-column: 2; } }
  .badge { display: inline-block; font: 600 12px/1 var(--f-body); padding: 6px 10px; border-radius: 99px; border: 1.5px solid currentColor; white-space: nowrap; justify-self: start; text-transform: capitalize; }
  .b-new { color: var(--red); } .b-uploading { color: var(--muted); } .b-reviewing { color: var(--maj); } .b-quoted { color: var(--focus); }
  .b-accepted, .b-in-progress, .b-delivered { color: var(--wa); } .b-declined, .b-archived { color: var(--muted); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }

  .drawer { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; background: rgba(0,0,0,.35); }
  .panel { width: min(760px, 100%); height: 100%; overflow-y: auto; background: var(--bg); padding: 0 0 60px; }
  .panel-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px; display: flex; gap: 12px; align-items: center; z-index: 2; }
  .panel-head h2 { font-size: 20px; }
  .panel-head .x { margin-left: auto; }
  .sec { margin: 16px 20px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .sec h3 { font: 500 12px/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 520px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 8px; } }
  .qgrid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .qgrid { grid-template-columns: 1fr 1fr; } .qgrid .amtf { grid-column: 1 / -1; } }
  .qf label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .qf { margin-bottom: 12px; }
  .amtf input { font: 700 24px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
  .chan { display: flex; flex-wrap: wrap; gap: 18px; margin: 6px 0 16px; }
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; display: grid; gap: 8px; }
  .result .okk { color: var(--wa); font-weight: 600; } .result .no { color: var(--red); font-weight: 600; }
  .hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
  .hist time { font: 500 12px var(--f-mono); color: var(--muted); display: block; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .setup { font-size: 14px; display: grid; gap: 10px; }
  .setup .line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--wa); } .dot.off { background: var(--maj); }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 6px; z-index: 90; font-size: 14px; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header class="adm-top">
  <div class="wrap">
    <img src="assets/logo.png" alt="ProDesigners" class="logo logo-light" height="24">
    <img src="assets/logo-dark.png" alt="" class="logo logo-dark" height="24">
    <h1>Audit requests</h1>
    <div class="sp" id="topBtns" hidden>
      <button class="btn btn-ghost btn-sm" id="setupBtn" type="button">Setup</button>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Sign out</button>
    </div>
  </div>
</header>

<form class="login" id="login" hidden>
  <h2>Team sign in</h2>
  <label class="ql" for="pw">Dashboard password</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <button class="btn btn-red" type="submit">Sign in</button>
  <p class="err" id="loginErr"></p>
</form>

<main class="wrap main" id="app" hidden>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <div class="chips small" id="statusChips"></div>
    <input type="search" id="q" placeholder="Search name, ref, area…" aria-label="Search requests">
  </div>
  <div class="rows" id="rows"></div>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="panel-head">
      <div><h2 id="dTitle">—</h2><small id="dSub" style="color:var(--muted)"></small></div>
      <button class="btn btn-ghost btn-sm x" id="closeBtn" type="button">Close</button>
    </div>
    <div id="dBody"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
