# /etc/nginx/sites-available/audit.prodesigners-qatar.com
server {
    server_name audit.prodesigners-qatar.com;
    client_max_body_size 600M;          # allow big DWG/ZIP uploads
    proxy_request_buffering off;         # stream uploads straight to the app
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 80;
}
# then: sudo certbot --nginx -d audit.prodesigners-qatar.com
