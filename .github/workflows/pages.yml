# Publishes the website (public/) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r public/* _site/
          # dashboard and quote pages live on the server, not on Pages
          rm -f _site/admin.html _site/admin.js _site/quote.html
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          sed -i "s|content=\"assets/og-image.jpg\"|content=\"$SITE_URL/assets/og-image.jpg\"|" _site/index.html
          sed -i "s|<meta property=\"og:type\"|<meta property=\"og:url\" content=\"$SITE_URL/\">\n<meta property=\"og:type\"|" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
